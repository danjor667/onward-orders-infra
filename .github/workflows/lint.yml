# Checks every template before it can reach main. GitSync deploys whatever is
# on main, so this is the gate.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint
      - name: No inline IAM policies
        run: |
          if grep -rnE '^\s*Policies:|AWS::IAM::Policy\b' templates bootstrap; then
            echo "Inline IAM policies are not allowed. Use AWS::IAM::ManagedPolicy."
            exit 1
          fi
